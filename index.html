<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彩妝體驗預約 | Makeup Booking</title>
    <style>
        :root {
            --primary-color: #d4a373;
            --bg-color: #fefae0;
            --text-color: #606c38;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
        }

        h2 { text-align: center; color: var(--primary-color); margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        
        button {
            width: 100%; padding: 15px; background-color: var(--primary-color);
            border: none; border-radius: 8px; color: white; font-size: 18px;
            cursor: pointer; transition: 0.3s; margin-top: 20px;
        }
        button:hover { background-color: #bc8a5f; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        #result {
            margin-top: 20px; padding: 15px; border-radius: 8px;
            display: none; text-align: center; font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>✨ 彩妝體驗預約</h2>
    <form id="bookingForm">
        <div class="form-group">
            <label>姓名</label>
            <input type="text" id="name" required placeholder="您的稱呼">
        </div>
        <div class="form-group">
            <label>電話</label>
            <input type="tel" id="phone" required placeholder="聯絡電話">
        </div>
        <div class="form-group">
            <label>LINE / IG</label>
            <input type="text" id="social" required placeholder="帳號 ID">
        </div>
        <div class="form-group">
            <label>選擇日期</label>
            <input type="date" id="date" required onchange="updateTimeSlots()">
        </div>
        <div class="form-group">
            <label>預約時段</label>
            <select id="time" required disabled>
                <option value="">請先選擇日期</option>
            </select>
        </div>
        <button type="submit" id="submitBtn">立即預約</button>
    </form>
    <div id="result"></div>
</div>

<script>
    // 替換成你從 Google Apps Script 取得的 URL
    const GAS_URL = '你的_GOOGLE_APPS_SCRIPT_網址';

    function updateTimeSlots() {
        const dateVal = document.getElementById('date').value;
        const timeSelect = document.getElementById('time');
        const day = new Date(dateVal).getDay();
        
        timeSelect.innerHTML = '';
        timeSelect.disabled = false;
        let options = [];

        if ([1, 3, 5].includes(day)) {
            options = ["19:00 - 21:00"];
        } else if ([6, 0].includes(day)) {
            options = ["10:00 - 12:00", "14:00 - 16:00", "18:00 - 20:00"];
        } else {
            const opt = document.createElement('option');
            opt.text = "當日不開放預約";
            timeSelect.add(opt);
            timeSelect.disabled = true;
            return;
        }

        options.forEach(t => {
            let opt = document.createElement('option');
            opt.value = t; opt.text = t;
            timeSelect.add(opt);
        });
    }

    document.getElementById('bookingForm').onsubmit = function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const result = document.getElementById('result');
        
        btn.disabled = true;
        btn.innerText = "傳送中...";

        const formData = new URLSearchParams();
        formData.append('name', document.getElementById('name').value);
        formData.append('phone', document.getElementById('phone').value);
        formData.append('social', document.getElementById('social').value);
        formData.append('date', document.getElementById('date').value);
        formData.append('time', document.getElementById('time').value);

        fetch(GAS_URL, {
            method: 'POST',
            body: formData,
            mode: 'no-cors'
        })
        .then(() => {
            result.style.display = 'block';
            result.style.backgroundColor = '#e9f5db';
            result.innerHTML = "🎉 預約成功！<br>我們將盡快與您聯繫。";
            btn.innerText = "預約完成";
        })
        .catch(() => {
            alert("傳送失敗，請稍後再試");
            btn.disabled = false;
            btn.innerText = "立即預約";
        });
    };
</script>

</body>
</html>
